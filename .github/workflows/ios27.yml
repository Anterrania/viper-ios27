name: iOS 27 — build and optional TestFlight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Upload to TestFlight (needs Apple secrets)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate-and-build:
    name: Generate Xcode project + build iOS 27
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun simctl list devices available | head -40

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate .xcodeproj
        run: xcodegen generate

      - name: Build for iOS 27 simulator
        run: |
          xcodebuild \
            -project AnterranianVIPER.xcodeproj \
            -scheme AnterranianVIPER \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload derived product
        uses: actions/upload-artifact@v4
        with:
          name: AnterranianVIPER-sim
          path: DerivedData/Build/Products/Debug-iphonesimulator/AnterranianVIPER.app
          if-no-files-found: warn

  testflight:
    name: Archive + TestFlight
    needs: generate-and-build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen + Fastlane
        run: |
          brew install xcodegen
          brew install fastlane

      - name: Generate project
        run: xcodegen generate

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_P8"
          mkdir -p fastlane
          printf '%s\n' "$ASC_KEY_P8" > fastlane/AuthKey_${ASC_KEY_ID}.p8

      - name: Fastlane beta
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: fastlane beta
